name: CI

on:
  pull_request:
  push:
    # This repository's default branch is master, not main.
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # build.sh downloads and uses its own Temurin 21 on Linux, because that is
      # what Render does. Caching it keeps this job from re-fetching ~200MB per
      # run while still exercising the same code path Render takes.
      - name: Cache the vendored JDK
        uses: actions/cache@v4
        with:
          path: jdk
          key: temurin-21.0.7

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # Runs build.sh rather than mvn directly, deliberately: the SDK is not on
      # Maven Central at the pinned version, so build.sh vendors the jar from
      # lib/ and installs it. Bumping pom.xml without re-vendoring breaks every
      # machine that does not already have the artifact cached — exactly the
      # failure this job exists to catch.
      - name: Build against the current SDK
        run: ./build.sh

      # build.sh packages with -DskipTests, and so does the Dockerfile, so
      # without this step the suite would exist and never run anywhere. It uses
      # the JDK build.sh just fetched: the runner's default JAVA_HOME is not
      # necessarily 21, and this project compiles with --release 21.
      #
      # No services are needed. The mesh tests stand the whole ring up in one
      # JVM against in-process doubles — no database, no intake, no staging.
      - name: Run the test suite
        run: |
          if [ -x "$PWD/jdk/bin/java" ]; then
            export JAVA_HOME="$PWD/jdk"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          ./mvnw test
